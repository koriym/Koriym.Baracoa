name: CI

on:
  push:
    branches: [ 1.x ]
  pull_request:
    branches: [ 1.x ]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Build Redux example
        run: |
          cd docs/example/redux
          npm install
          npm run build

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse -c phpstan.neon

      - name: Run Psalm
        run: ./vendor/bin/psalm --show-info=false

  coding-standards:
    name: Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHP_CodeSniffer
        run: ./vendor/bin/phpcs

  v8js-test:
    name: PHPUnit with V8Js (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Alpine Linux
        uses: jirutka/setup-alpine@v1

      - name: Install dependencies
        run: |
          apk add php83-dev nodejs-dev g++ make git
        shell: alpine.sh --root {0}

      - name: Build v8js extension
        run: |
          git clone --branch php8 --depth 1 https://github.com/phpv8/v8js.git /tmp/v8js
          cd /tmp/v8js
          phpize
          ./configure
          make
          make install
        shell: alpine.sh {0}

      - name: Install PHP packages and test
        run: |
          apk add php83 php83-phar php83-iconv php83-mbstring php83-openssl php83-curl php83-dom php83-xml php83-xmlwriter php83-tokenizer php83-simplexml php83-ctype npm git curl
          echo "extension=v8js.so" > /etc/php83/conf.d/50_v8js.ini
          php83 -m | grep v8js
          # Install composer
          curl -sS https://getcomposer.org/installer | php83 -- --install-dir=/usr/local/bin --filename=composer
          # Build Redux example
          cd docs/example/redux && npm install && npm run build && cd ../../..
          # Install and test
          composer install --no-progress
          php83 vendor/bin/phpunit
        shell: alpine.sh --root {0}
