name: CI

on:
  push:
    branches: [ 1.x ]
  pull_request:
    branches: [ 1.x ]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Build Redux example
        run: |
          cd docs/example/redux
          npm install
          npm run build

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse -c phpstan.neon

      - name: Run Psalm
        run: ./vendor/bin/psalm --show-info=false

  coding-standards:
    name: Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHP_CodeSniffer
        run: ./vendor/bin/phpcs

  v8js-test:
    name: PHPUnit with V8Js (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install V8 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:phoerious/libv8
          sudo apt-get update
          sudo apt-get install -y libv8-dev php-dev

      - name: Debug V8 location
        run: |
          echo "=== Searching for V8 ==="
          find /usr -name "v8.h" 2>/dev/null | head -5
          find /usr -name "libv8*" 2>/dev/null | head -10
          pkg-config --cflags --libs v8 2>/dev/null || echo "v8 pkg-config not found"

      - name: Build V8Js extension
        run: |
          git clone --depth=1 --branch php8 https://github.com/phpv8/v8js.git /tmp/v8js
          cd /tmp/v8js
          phpize
          ./configure
          make -j$(nproc)
          sudo make install
          echo "extension=v8js.so" | sudo tee /etc/php/8.2/cli/conf.d/v8js.ini

      - name: Verify V8Js
        run: php -m | grep v8js

      - name: Build Redux example
        run: |
          cd docs/example/redux
          npm install
          npm run build

      - name: Install Composer dependencies
        run: composer install --no-progress

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

